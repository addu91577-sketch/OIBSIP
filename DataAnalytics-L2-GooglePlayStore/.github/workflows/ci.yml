name: CI - Google Play Store Analysis & NLP Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-cache NLTK Corpora
        run: |
          python -c "import nltk; nltk.download('vader_lexicon', quiet=True); nltk.download('stopwords', quiet=True)"

      - name: Verify Clean Data Integrity
        run: |
          python -c "import pandas as pd; apps = pd.read_csv('Data/cleaned_googleplaystore.csv'); revs = pd.read_csv('Data/cleaned_user_reviews.csv'); assert len(apps) == 9659, f'Unexpected apps count: {len(apps)}'; assert len(revs) == 29692, f'Unexpected reviews count: {len(revs)}'; print('Clean datasets verified successfully!')"

      - name: Run Pytest Regression Suite across All Days (Days 1 - 9)
        run: |
          python -m pytest tests/ -v --durations=10
