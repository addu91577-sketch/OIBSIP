version: '3.8'

services:
  retail-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retail-sales-api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./Data:/app/Data:ro
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  retail-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retail-sales-dashboard
    command: streamlit run src/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./Data:/app/Data:ro
      - ./models:/app/models
    depends_on:
      - retail-api
    restart: unless-stopped
